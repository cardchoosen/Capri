name: Validate and index public Skills
on:
  pull_request:
  push:
    branches: [main]
    paths: ['skills/**', 'tools/catalog.py', '.github/workflows/catalog.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/catalog.py
  index:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: public-skill-index
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Publish catalog from the latest main tree
        run: |
          git pull --ff-only origin main
          python3 tools/catalog.py --write index.json
          if git diff --quiet -- index.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.json
          git commit -m 'Update public Skill index'
          git push origin HEAD:main
