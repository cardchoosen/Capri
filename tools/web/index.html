<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capri</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><header><span class="mark">⌁</span> C A P R I <small>USB</small></header><button id="create">＋ 新建任务对话</button><div id="pinned-sessions" aria-label="默认会话"></div><nav id="sessions" aria-label="会话列表"></nav><footer>执行于手机 · 同一份会话</footer></aside><main><header><div><strong id="title">Capri</strong><small id="connection" role="status">正在连接手机…</small></div><div class="header-actions"><button id="catalog-open">Tools / MCP / Skills</button><button id="refresh" title="重新连接">刷新连接</button></div></header><div id="messages" aria-label="聊天记录"><button id="older" hidden>加载更早消息</button><div id="entries"></div><div id="progress"></div></div><div id="error" role="alert" hidden></div><div id="uncertain" hidden>上次操作结果未确认。请先查看会话记录，避免重复执行。<button id="ack">已核对记录</button></div><form id="composer"><textarea id="input" placeholder="从这里继续对话…" aria-label="消息" rows="2" maxlength="12000"></textarea><div class="actions"><span>Enter 发送 · Shift Enter 换行</span><button type="button" id="stop" hidden>停止</button><button id="send" type="submit">发送 ↑</button></div></form></main><dialog id="delete-dialog"><h3>删除对话？</h3><p id="delete-description"></p><div class="dialog-actions"><button id="delete-cancel">取消</button><button id="delete-confirm">删除</button></div></dialog><dialog id="catalog-dialog" aria-labelledby="catalog-title"><header><h3 id="catalog-title">Tools / MCP / Skills</h3><button id="catalog-close">关闭</button></header><small>只读查看手机配置 · MCP 工具按当前会话连接展示</small><div id="catalog-tabs" role="tablist" aria-label="能力分类"><button role="tab" data-category="tools" aria-selected="true">Tools</button><button role="tab" data-category="mcp" aria-selected="false">MCP</button><button role="tab" data-category="skills" aria-selected="false">Skills</button></div><div class="catalog-search"><input id="catalog-query" type="search" maxlength="300" aria-label="搜索能力" placeholder="搜索名称或用途"><button id="catalog-refresh">刷新</button></div><p id="catalog-status" role="status"></p><button id="catalog-back" hidden>返回列表</button><div id="catalog-content"></div><button id="catalog-more" hidden>加载更多</button></dialog></body></html>
