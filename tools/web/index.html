<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capri</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><aside><header><span class="mark">⌁</span> C A P R I <small>USB</small></header><button id="create">＋ 新建任务对话</button><nav id="sessions" aria-label="会话列表"></nav><footer>执行于手机 · 同一份会话</footer></aside><main><header><div><strong id="title">Capri</strong><small id="connection" role="status">正在连接手机…</small></div><button id="refresh" title="重新连接">刷新连接</button></header><div id="messages" aria-label="聊天记录"><button id="older" hidden>加载更早消息</button><div id="entries"></div><div id="progress"></div></div><div id="error" role="alert" hidden></div><div id="uncertain" hidden>上次操作结果未确认。请先查看会话记录，避免重复执行。<button id="ack">已核对记录</button></div><form id="composer"><textarea id="input" placeholder="从这里继续对话…" aria-label="消息" rows="2" maxlength="12000"></textarea><div class="actions"><span>Enter 发送 · Shift Enter 换行</span><button type="button" id="stop" hidden>停止</button><button id="send" type="submit">发送 ↑</button></div></form></main><dialog id="delete-dialog"><h3>删除对话？</h3><p id="delete-description"></p><div class="dialog-actions"><button id="delete-cancel">取消</button><button id="delete-confirm">删除</button></div></dialog></body></html>
