<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capri 对话</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/host.css">
  <script src="/markdown.js" defer></script>
  <script src="/host.js" defer></script>
</head>
<body data-remote="__CAPRI_REMOTE__">
  <aside>
    <header><span class="mark">⌁</span> C A P R I</header>
    <div class="view-switch" role="group" aria-label="页面">
      <button id="chat-tab" type="button" aria-pressed="true">对话</button>
      <button id="settings-tab" type="button" aria-pressed="false" disabled>设置</button>
    </div>
    <button id="create" disabled>＋ 新建对话</button>
    <nav id="sessions" aria-label="会话列表"></nav>
    <footer>Capri 服务端 · 独立工作区</footer>
  </aside>
  <main>
    <header>
      <div><strong id="title">Capri 对话</strong><small id="connection" role="status">正在连接…</small></div>
      <div id="chat-actions" class="header-actions">
        <button id="refresh" class="icon-button" type="button" title="刷新对话" aria-label="刷新对话" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 6M20 5v6h-6"/></svg>
        </button>
        <button id="device-open" hidden>Android 设备</button>
        <button id="session-menu" type="button" title="管理会话" aria-label="管理会话" disabled>⋯</button>
        <button id="export" disabled>导出对话</button>
        <button id="files-toggle" class="icon-button" type="button" aria-label="展开会话文件" title="展开会话文件" aria-controls="session-files" aria-expanded="false" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M15 5v14"/></svg>
        </button>
      </div>
    </header>
    <form id="access" hidden>
      <label>访问令牌 <input name="token" type="password" required autocomplete="off"></label>
      <button>连接</button>
    </form>
    <div id="messages" aria-label="聊天记录" tabindex="0">
      <div id="history"></div><div id="progress" role="status"></div>
    </div>
    <div id="error" role="alert" hidden></div>
    <section id="settings" aria-label="设置" hidden>
      <div class="settings-heading">
        <p id="settings-session"></p>
        <button id="settings-refresh" type="button">刷新</button>
      </div>
      <div class="settings-grid">
        <details class="settings-card">
          <summary>Rules</summary>
          <div class="settings-details" id="rules-status"></div>
        </details>
        <details class="settings-card">
          <summary>Skills</summary>
          <div class="settings-details">
            <div id="installed-skills" aria-live="polite"></div>
            <button id="skills-open" hidden type="button">Skill 库</button>
          </div>
        </details>
        <details class="settings-card">
          <summary>MCP</summary>
          <div class="settings-details" id="mcp-status" aria-live="polite"></div>
        </details>
        <details class="settings-card">
          <summary>Tools</summary>
          <div class="settings-details" id="tools-status" aria-live="polite"></div>
        </details>
      </div>
    </section>
    <form id="composer" hidden>
      <div class="composer-card">
        <label for="input" class="visually-hidden">消息</label>
        <textarea id="input" name="text" rows="2" required maxlength="4000" placeholder="跟 Capri 说点什么…"></textarea>
        <button id="chat-image" type="button" hidden title="移除图片附件"></button>
        <button id="transcribe-audio" type="button" hidden>转写 WAV</button>
        <div class="actions">
          <div class="model-controls">
            <label class="composer-choice"><span class="visually-hidden">模型</span><select id="chat-model"></select></label>
            <label class="composer-choice" id="chat-effort-control"><span>推理</span><select id="chat-effort"></select></label>
          </div>
          <div class="composer-actions">
            <input id="workspace-file" type="file" hidden>
            <button id="upload" type="button" aria-label="添加文件" title="添加文件">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 11-8.5 8.5a5 5 0 0 1-7-7l9-9a3.5 3.5 0 0 1 5 5l-9 9a2 2 0 0 1-3-3l8.5-8.5"/></svg><span>添加文件</span>
            </button>
            <button id="cancel-turn" type="button" hidden>停止</button>
            <button id="steer-turn" type="button" hidden>补充</button>
            <button id="send">发送 <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
          </div>
        </div>
      </div>
    </form>
  </main>
  <dialog id="skills-catalog">
    <header><h2>Skill 库</h2><button id="skills-close" type="button">关闭</button></header>
    <p id="skills-status" role="status"></p>
    <label>版本 <select id="skills-version"></select></label>
    <pre id="skills-preview"></pre>
    <button id="skills-install" type="button" disabled>安装此版本</button>
    <label>保留的修订 <select id="skills-revision"></select></label>
    <button id="skills-rollback" type="button" disabled>回退</button>
  </dialog>
  <dialog id="device">
    <header><h2>Android 局域网验证</h2><button id="device-close" type="button">关闭</button></header>
    <p>在手机的远程 Capri 页面开启一次接单，再提交应用包名。</p>
    <form id="launch">
      <label>应用包名 <input name="packageName" placeholder="com.android.settings" required maxlength="200"></label>
      <button>打开 App</button>
    </form>
    <button id="device-refresh" type="button">刷新设备状态</button>
    <pre id="device-status" role="status"></pre>
  </dialog>
  <section id="session-files" aria-label="会话文件" hidden>
    <header><h2>会话文件</h2><button id="files-close" type="button" aria-label="收起会话文件" title="收起会话文件">×</button></header>
    <p id="files-status" role="status"></p>
    <div id="file-tree"></div>
  </section>
  <dialog id="session-dialog" aria-labelledby="session-dialog-title">
    <header><h2 id="session-dialog-title">管理会话</h2><button id="session-close" type="button">关闭</button></header>
    <form id="session-edit">
      <label for="session-name">会话名称</label>
      <input id="session-name" required maxlength="80" autocomplete="off">
      <p id="session-edit-status" role="status"></p>
      <div class="dialog-actions">
        <button id="session-delete" type="button">删除会话</button>
        <button id="session-save" type="submit">保存名称</button>
      </div>
    </form>
  </dialog>
</body>
</html>
